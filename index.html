<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SECCO | Inspección Offline</title>
  <style>
    :root {
      --bg: #0b0b0e;
      --card: rgba(255,255,255,.06);
      --card-2: rgba(255,255,255,.09);
      --line: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --brand: #ffd200;
      --brand-2: #ffea7a;
      --ok: #22c55e;
      --no: #ef4444;
      --radius: 16px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    * { box-sizing: border-box; transition: all 0.2s ease; }
    body { margin: 0; background-color: var(--bg); color: var(--text); font-family: var(--font); padding: 20px 18px 140px; }
    
    .wrap { max-width: 850px; margin: 0 auto; }
    
    /* Branding */
    .brand { font-weight: 800; font-size: 22px; margin-bottom: 20px; letter-spacing: -1px; display: flex; justify-content: space-between; align-items: center; }
    .brand span { color: var(--brand); }
    
    /* Badge Offline Status */
    .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--muted); text-transform: uppercase; }
    .status-badge.online { border-color: var(--ok); color: var(--ok); }

    /* Score Card con Estética SECCO */
    .score-card {
      background: linear-gradient(145deg, var(--card-2), rgba(0,0,0,0.4));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px;
      margin-bottom: 32px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      display: none;
    }
    .score-card.revealed { display: block; border-color: var(--brand); animation: fadeIn 0.4s ease; }
    .score-number { font-size: clamp(48px, 8vw, 64px); font-weight: 800; line-height: 1; margin: 5px 0; }
    .verdict-box { margin-top: 10px; padding: 10px 20px; border-radius: 8px; font-weight: 800; font-size: 13px; text-transform: uppercase; background: rgba(255,255,255,0.03); border: 1px solid var(--line); }

    /* Inputs y Selects */
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 25px; }
    .meta-input { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .meta-input label { display: block; font-size: 9px; color: var(--brand); text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
    .meta-select, .meta-input input { width: 100%; background: transparent; border: none; color: var(--text); font-weight: 700; outline: none; font-size: 15px; }

    /* Secciones */
    .section-block { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 25px; }
    .section-tag { color: var(--brand); font-weight: 800; font-size: 10px; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .section-tag::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .check-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .check-row span { font-size: 14px; opacity: 0.9; }

    /* Selectores SECCO */
    .selector { display: flex; gap: 4px; }
    .pill { font-size: 10px; font-weight: 700; padding: 8px 14px; border-radius: 8px; background: var(--card-2); border: 1px solid var(--line); color: var(--muted); cursor: pointer; text-transform: uppercase; }
    .pill.active { background: var(--brand); color: #000; border-color: var(--brand); }

    .textarea { width: 100%; background: rgba(0,0,0,0.25); border: 1px solid var(--line); border-radius: 10px; padding: 12px; color: var(--text); margin-top: 10px; font-size: 13px; outline: none; resize: none; min-height: 80px; }

    /* Barra de Acción */
    .action-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 25px; background: rgba(11, 11, 14, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .btn-submit { width: 100%; max-width: 450px; background: var(--card-2); color: var(--muted); border: none; padding: 18px; border-radius: 14px; font-weight: 800; text-transform: uppercase; cursor: not-allowed; }
    .btn-submit.ready { background: var(--brand); color: #000; cursor: pointer; box-shadow: 0 8px 24px rgba(255,210,0,0.2); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { .check-row { flex-direction: column; align-items: flex-start; gap: 12px; } }
  </style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div>SEC<span>CO</span></div>
    <div id="connectionStatus" class="status-badge">Modo Offline</div>
  </div>

  <div class="score-card" id="mainScoreCard">
    <div style="font-size: 10px; font-weight: 700; color: var(--muted)">ÍNDICE DE SALUD TÉCNICA</div>
    <div class="score-number" id="scoreNum">--%</div>
    <div id="verdictStatus" class="verdict-box">CALCULANDO...</div>
  </div>

  <div class="meta-grid">
    <div class="meta-input">
      <label>Unidad</label>
      <input type="text" id="unidad" placeholder="PPU / Patente" oninput="checkIntegrity()">
    </div>
    <div class="meta-input">
      <label>Kilometraje</label>
      <input type="number" id="km" placeholder="000.000" oninput="checkIntegrity()">
    </div>
  </div>

  <section class="section-block">
    <div class="section-tag">Estado de Componentes</div>
    <div class="check-row">
      <span>Sistema de Frenado</span>
      <div class="selector">
        <div class="pill" data-pts="10" onclick="sel(this)">Óptimo</div>
        <div class="pill" data-pts="0" onclick="sel(this)">Crítico</div>
      </div>
    </div>
    <div class="check-row">
      <span>Niveles de Fluido</span>
      <div class="selector">
        <div class="pill" data-pts="10" onclick="sel(this)">OK</div>
        <div class="pill" data-pts="0" onclick="sel(this)">Bajo</div>
      </div>
    </div>
    <textarea class="textarea" id="obs" placeholder="Notas técnicas adicionales..."></textarea>
  </section>

  <div class="action-bar">
    <button class="btn-submit" id="btnSubmit" onclick="saveData()">Esperando datos...</button>
    <div id="syncMsg" style="font-size: 11px; color: var(--muted); display: none;">Hay reportes pendientes por sincronizar.</div>
  </div>
</div>

<script>
  // 1. Manejo de Selección
  function sel(e) {
    e.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    e.classList.add('active');
    checkIntegrity();
  }

  // 2. Lógica de Negocio y Validación
  function checkIntegrity() {
    const total = document.querySelectorAll('.selector').length;
    const answered = document.querySelectorAll('.pill.active').length;
    const metaOk = document.getElementById('unidad').value && document.getElementById('km').value;
    const btn = document.getElementById('btnSubmit');

    if (answered === total && metaOk) {
      calculateScore();
      btn.disabled = false;
      btn.className = "btn-submit ready";
      btn.innerText = "Guardar Inspección Local";
    } else {
      btn.innerText = "Faltan datos de inspección";
      btn.disabled = true;
      btn.className = "btn-submit";
    }
  }

  function calculateScore() {
    let current = 0; let max = 20; // Simplificado para el ejemplo
    document.querySelectorAll('.pill.active').forEach(a => current += parseInt(a.getAttribute('data-pts')));
    
    const percent = Math.round((current / max) * 100);
    const card = document.getElementById('mainScoreCard');
    const num = document.getElementById('scoreNum');
    const verd = document.getElementById('verdictStatus');

    card.classList.add('revealed');
    num.innerText = percent + '%';
    
    if (percent >= 90) { verd.innerText = "Operativo"; verd.style.color = "var(--ok)"; }
    else { verd.innerText = "Requiere Atención"; verd.style.color = "var(--brand)"; }
  }

  // 3. Persistencia Offline (LocalStorage)
  function saveData() {
    const report = {
      id: Date.now(),
      unidad: document.getElementById('unidad').value,
      salud: document.getElementById('scoreNum').innerText,
      fecha: new Date().toISOString()
    };

    // Obtener existentes
    const pending = JSON.parse(localStorage.getItem('secco_pending') || '[]');
    pending.push(report);
    localStorage.setItem('secco_pending', JSON.stringify(pending));

    alert("✅ Reporte guardado en el dispositivo. Se sincronizará al detectar conexión.");
    location.reload();
  }

  // 4. Detección de Conexión
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);

  function updateStatus() {
    const badge = document.getElementById('connectionStatus');
    const syncMsg = document.getElementById('syncMsg');
    const pending = JSON.parse(localStorage.getItem('secco_pending') || '[]');

    if (navigator.onLine) {
      badge.innerText = "En Línea";
      badge.classList.add('online');
      if (pending.length > 0) {
        syncMsg.style.display = "block";
        syncMsg.innerText = `Sincronizando ${pending.length} reportes...`;
        // Aquí iría la llamada fetch() para vaciar el LocalStorage hacia el servidor
      }
    } else {
      badge.innerText = "Modo Offline";
      badge.classList.remove('online');
    }
  }

  // Inicializar
  updateStatus();
</script>

</body>
</html>
