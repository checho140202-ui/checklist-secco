<script>
  // Asegúrate de poner tu URL aquí
  const SCRIPT_URL = 'TU_URL_DE_APPS_SCRIPT'; 

  async function finalizar() {
    const btn = document.getElementById('btnSubmit');
    btn.innerText = "🚀 REGISTRANDO EN SISTEMA...";
    btn.disabled = true;

    // Capturamos todos los datos del formulario
    const data = {
      fecha: document.getElementById('fecha_inspeccion').value,
      unidad: document.getElementById('unidad').value,
      km: document.getElementById('km').value,
      conductor: document.getElementById('conductor').value,
      salud: document.getElementById('scoreNum').innerText,
      veredicto: document.getElementById('verdictStatus').innerText,
      
      // Observaciones detalladas por sección
      obs_fugas: document.getElementById('obs_fugas').value,
      obs_motor: document.getElementById('obs_motor').value,
      obs_otros: document.getElementById('obs_otros').value
    };

    try {
      // Enviamos a Google Sheets
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      alert("✅ Registro guardado exitosamente en SECCO.");
      location.reload(); 
    } catch (e) {
      alert("❌ Error de conexión.");
      btn.disabled = false;
      btn.innerText = "REINTENTAR";
    }
  }
</script>
